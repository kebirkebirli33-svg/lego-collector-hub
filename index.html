<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGO Collector Hub & Store Comparison</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-yellow: #ffcf00;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #333333;
            --green-price: #4caf50;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }
        header {
            background-color: var(--card-bg);
            border-bottom: 3px solid var(--accent-yellow);
            padding: 20px;
            text-align: center;
        }
        h1 { color: var(--accent-yellow); margin: 0; font-size: 28px; }
        p.subtitle { color: var(--text-muted); margin: 5px 0 0; }
        
        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }

        /* Controls: Personas & Search */
        .controls-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .persona-tabs {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .persona-btn {
            background: #252525;
            color: var(--text-main);
            border: 2px solid var(--border-color);
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .persona-btn:hover, .persona-btn.active {
            border-color: var(--accent-yellow);
            background: var(--accent-yellow);
            color: #000;
        }

        .search-bar {
            display: flex;
            gap: 10px;
        }
        .search-bar input {
            flex: 1;
            padding: 12px;
            background: #121212;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
        }

        /* Set Cards Grid */
        .sets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }
        .set-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }
        .set-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-yellow);
        }
        .set-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #252525;
        }
        .set-info {
            padding: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .set-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent-yellow);
            margin: 0 0 5px 0;
        }
        .set-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }
        .rating {
            color: #ffb400;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 15px;
        }

        /* Price Comparison Table */
        .price-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }
        .price-table th, .price-table td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        .price-table th { color: var(--text-muted); }
        .best-price { color: var(--green-price); font-weight: bold; }

        /* Reviews Section */
        .reviews-box {
            background: #161616;
            border-radius: 6px;
            padding: 10px;
            margin-top: 12px;
            font-size: 12px;
        }
        .review-author { font-weight: bold; color: var(--accent-yellow); }
        .review-text { color: #ddd; margin-top: 3px; }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 12px;
            border-top: 1px solid var(--border-color);
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>LEGO Collector Hub & Price Tracker</h1>
        <p class="subtitle">LEGO Store, Legurda, Legoposter və s. qiymət müqayisəsi, reytinqlər və rəylər</p>
    </header>

    <div class="container">
        <!-- Control Bar -->
        <div class="controls-panel">
            <div class="persona-tabs">
                <button class="persona-btn active" onclick="filterPersona('all')">Bütün Dəstlər</button>
                <button class="persona-btn" onclick="filterPersona('anton')">Anton (5 yaş - City / 3-in-1)</button>
                <button class="persona-btn" onclick="filterPersona('will')">Will (18 yaş - Technic / Ən Yaxşı Qiymət)</button>
                <button class="persona-btn" onclick="filterPersona('harrison')">Harrison (28 yaş - Eksklüziv / Nadir)</button>
            </div>
            <div class="search-bar">
                <input type="text" id="searchInput" onkeyup="searchSets()" placeholder="Dəst adı və ya nömrəsi ilə axtar (məs: T-Rex, Technic, 76964)...">
            </div>
        </div>

        <!-- Sets Grid -->
        <div class="sets-grid" id="setsContainer">
            <!-- Dynamically Rendered -->
        </div>
    </div>

    <footer>
        &copy; 2026 LEGO Collector Hub. Mağaza qiymət müqayisəsi və kolleksiya izləyicisi.
    </footer>

    <script>
        const legoData = [
            {
                id: "76964",
                name: "Dinosaur Fossils: T. rex Skull",
                theme: "Jurassic World",
                pieces: 577,
                age: "9+",
                image: "https://images.unsplash.com/photo-1585366119957-e9730b6d0f60?auto=format&fit=crop&w=600&q=80",
                persona: "harrison",
                rating: "4.9 / 5.0 (142 rəy)",
                stores: [
                    { name: "LEGO Official Store", price: "$39.99", stock: "Mövcuddur" },
                    { name: "Legurda Store", price: "$35.50", stock: "Stokda azdır", best: true },
                    { name: "Legoposter Store", price: "$38.00", stock: "Mövcuddur" }
                ],
                reviews: [
                    { author: "Harrison W.", text: "Masaüstü üçün mükəmməl görünüşə malikdir. Detalları çox dəqiqdir!" },
                    { author: "Kolleksiyaçı_99", text: "Legurda mağazasında qiymət daha ucuz idi, oradan sifariş etdim." }
                ]
            },
            {
                id: "42156",
                name: "PEUGEOT 9X8 24H Le Mans Hybrid Hypercar",
                theme: "Technic",
                pieces: 1775,
                age: "18+",
                image: "https://images.unsplash.com/photo-1563720223185-11003d516935?auto=format&fit=crop&w=600&q=80",
                persona: "will",
                rating: "4.8 / 5.0 (89 rəy)",
                stores: [
                    { name: "LEGO Official Store", price: "$199.99", stock: "Mövcuddur" },
                    { name: "Legurda Store", price: "$185.00", stock: "Mövcuddur", best: true },
                    { name: "Legoposter Store", price: "$192.50", stock: "Stokda var" }
                ],
                reviews: [
                    { author: "Will_Uni", text: "Asqı sistemi və mühərrik detalları fantastikdir. Qiyməti müqayisə edib $15 qənaət etdim!" }
                ]
            },
            {
                id: "31136",
                name: "Exotic Parrot 3in1",
                theme: "Creator 3-in-1",
                pieces: 253,
                age: "7+",
                image: "https://images.unsplash.com/photo-1587654780291-39c9404d746b?auto=format&fit=crop&w=600&q=80",
                persona: "anton",
                rating: "4.7 / 5.0 (65 rəy)",
                stores: [
                    { name: "LEGO Official Store", price: "$19.99", stock: "Mövcuddur" },
                    { name: "Legurda Store", price: "$19.99", stock: "Mövcuddur" },
                    { name: "Legoposter Store", price: "$17.99", stock: "Endirimdədir!", best: true }
                ],
                reviews: [
                    { author: "Anton's Parent", text: "5 yaşlı oğlum üçün aldım, yığması və təlimatı çox asandır!" }
                ]
            },
            {
                id: "60388",
                name: "Gaming Tournament Truck",
                theme: "City",
                pieces: 344,
                age: "7+",
                image: "https://images.unsplash.com/photo-1560969184-10fe8719e047?auto=format&fit=crop&w=600&q=80",
                persona: "anton",
                rating: "4.6 / 5.0 (40 rəy)",
                stores: [
                    { name: "LEGO Official Store", price: "$39.99", stock: "Mövcuddur" },
                    { name: "Legurda Store", price: "$34.99", stock: "Mövcuddur", best: true },
                    { name: "Legoposter Store", price: "$36.00", stock: "Mövcuddur" }
                ],
                reviews: [
                    { author: "Rauf_City", text: "Uşaqlar saatlarla oynayır, rəngləri və fiqurları çox canlıdır." }
                ]
            }
        ];

        function renderSets(data) {
            const container = document.getElementById('setsContainer');
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); text-align: center; grid-column: 1/-1;">Heç bir dəst tapılmadı.</p>';
                return;
            }

            data.forEach(set => {
                let storeRows = set.stores.map(store => `
                    <tr>
                        <td><strong>${store.name}</strong></td>
                        <td class="${store.best ? 'best-price' : ''}">${store.price} ${store.best ? '★ Ən Ucuza' : ''}</td>
                        <td style="color: #aaa;">${store.stock}</td>
                    </tr>
                `).join('');

                let reviewRows = set.reviews.map(r => `
                    <div class="reviews-box">
                        <div class="review-author">${r.author}</div>
                        <div class="review-text">"${r.text}"</div>
                    </div>
                `).join('');

                const card = document.createElement('div');
                card.className = 'set-card';
                card.innerHTML = `
                    <img class="set-img" src="${set.image}" alt="${set.name}">
                    <div class="set-info">
                        <div class="set-title">#${set.id} ${set.name}</div>
                        <div class="set-meta">Mövzu: ${set.theme} | ${set.pieces} Hissə | Yaş: ${set.age}</div>
                        <div class="rating">★ ${set.rating}</div>
                        
                        <div style="font-weight: bold; font-size: 13px; margin-bottom: 5px; color: var(--accent-yellow);">Mağaza Qiymətləri Müqayisəsi:</div>
                        <table class="price-table">
                            <thead>
                                <tr>
                                    <th>Mağaza</th>
                                    <th>Qiymət</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${storeRows}
                            </tbody>
                        </table>

                        <div style="font-weight: bold; font-size: 13px; margin-top: 15px; color: var(--accent-yellow);">Son Rəylər:</div>
                        ${reviewRows}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterPersona(persona) {
            document.querySelectorAll('.persona-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');

            if (persona === 'all') {
                renderSets(legoData);
            } else {
                const filtered = legoData.filter(item => item.persona === persona);
                renderSets(filtered);
            }
        }

        function searchSets() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = legoData.filter(item => 
                item.name.toLowerCase().includes(query) || 
                item.id.includes(query) || 
                item.theme.toLowerCase().includes(query)
            );
            renderSets(filtered);
        }

        // Initial Load
        renderSets(legoData);
    </script>
</body>
</html>
